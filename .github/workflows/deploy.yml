name: Deploy Next.js to GitHub Pages (+ Native OTA Bundle)

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Build Native OTA Bundle (root-relative paths for APK live updates)
        run: |
          rm -rf ./out ./ota-dist
          node scripts/build-cap.mjs
          node scripts/build-ota-bundle.mjs
        env:
          CAPACITOR_BUILD: "true"
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_OTA_VERSION: "1.0.${{ github.run_number }}"
          OTA_VERSION: "1.0.${{ github.run_number }}"
          OTA_NOTES: "Updated sacred wisdom cards and enhancements (build ${{ github.run_number }})."

      - name: Build Web PWA for GitHub Pages
        run: |
          rm -rf ./out
          npx next build
        env:
          NEXT_PUBLIC_BASE_PATH: "/kuberan-dharma-app"

      - name: Attach OTA Bundle & Manifest to GitHub Pages output
        run: |
          mkdir -p ./out/ota
          cp ./ota-dist/ota-manifest.json ./out/ota-manifest.json
          cp ./ota-dist/ota/kuberan-dharma-bundle.zip ./out/ota/kuberan-dharma-bundle.zip
          touch ./out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
